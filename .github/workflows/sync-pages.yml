name: Sync portfolio and publish Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      failed: ${{ steps.sync.outputs.failed }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Test data and failure handling
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs
      - name: Google read-only access
        id: google
        if: vars.GSC_WIF_PROVIDER != '' && vars.GSC_SERVICE_ACCOUNT != ''
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GSC_WIF_PROVIDER }}
          service_account: ${{ vars.GSC_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Refresh public data and retain last good snapshots
        id: sync
        env:
          GSC_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GSC_CONFIGURED: ${{ vars.GSC_WIF_PROVIDER != '' && vars.GSC_SERVICE_ACCOUNT != '' }}
        run: python scripts/sync.py --use-live-fallback
      - name: Build allowlisted public files
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Record connection status
        env:
          AUTH_OUTCOME: ${{ steps.google.outcome }}
        run: |
          echo "Google authorization: ${AUTH_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          python -c 'import json; from pathlib import Path; [print(p.stem + ": " + json.loads(p.read_text())["status"]) for p in Path("_site/data").glob("*.json")]' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked data
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failures after publishing the last good data
        if: needs.build.outputs.failed != ''
        run: |
          echo 'A source could not refresh. The site retains its previous verified data and shows the failed update status.'
          exit 1
