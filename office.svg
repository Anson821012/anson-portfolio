<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" fill="none">
<title>一起把麻煩整理好的小辦公室</title>
<desc>一位穿藍色襯衫的人坐在桌邊，小機器人在旁邊整理紙張，窗外是安靜的城市。</desc>
<style>
  .ink{stroke:#344037;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
  .thin{stroke:#344037;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .float-a{animation:drift 7s ease-in-out infinite;transform-origin:120px 145px}.float-b{animation:drift 8s ease-in-out -3s infinite;transform-origin:584px 154px}.steam{animation:steam 4s ease-in-out infinite}.robot-head{animation:nod 9s ease-in-out infinite;transform-origin:537px 298px}.eyes{animation:blink 7s infinite;transform-origin:530px 275px}.sorting{animation:sort 10s ease-in-out infinite;transform-origin:460px 305px}
  @keyframes drift{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  @keyframes steam{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.85;transform:translateY(-7px)}}
  @keyframes nod{0%,35%,70%,100%{transform:rotate(0)}43%,58%{transform:rotate(-6deg)}}
  @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}
  @keyframes sort{0%,100%{transform:translate(0,0) rotate(0)}30%,60%{transform:translate(-12px,-9px) rotate(-4deg)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
